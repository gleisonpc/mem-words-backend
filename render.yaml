# Blueprint do Render (https://render.com/docs/blueprint-spec)
#
# Mantém a configuração de deploy versionada junto do código. Sem isso o
# Render usa o build command padrão (`npm install`), que NÃO compila o
# TypeScript — e o start falha com "Cannot find module dist/server.js".
services:
  - type: web
    name: mem-words-backend
    runtime: node
    plan: free

    # --include=dev é obrigatório: typescript é devDependency e o Render
    # define NODE_ENV=production, que faria o npm pular as devDependencies.
    # `prisma migrate deploy` aplica as migrations pendentes a cada deploy.
    buildCommand: npm ci --include=dev && npm run build && npx prisma migrate deploy
    startCommand: npm start

    # Aponta para a prontidão, e não para /health: assim um deploy com
    # DATABASE_URL errada falha em vez de ficar verde com o banco fora.
    healthCheckPath: /health/ready

    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Origem de produção do frontend, mais um padrão (com "*") cobrindo os
      # deploys de revisão que a Vercel gera por branch e por build — sem o
      # padrão, cada PR do frontend precisaria de uma entrada nova aqui.
      #
      # O domínio de produção abaixo é o padrão que a Vercel atribui a um
      # projeto sem domínio customizado (dado o nome do projeto observado
      # nos deploys, "mem-words-frontend"), não uma confirmação — se o
      # frontend usar outro domínio, troque só este valor.
      - key: CORS_ORIGIN
        value: "https://mem-words-frontend.vercel.app,https://mem-words-frontend-*-memo-65b2.vercel.app"
      # Definidas no painel do Render (sync: false = não versionadas):
      #   DATABASE_URL       -> connection string do Neon (a "pooled")
      #   JWT_ACCESS_SECRET  -> openssl rand -base64 48
      #   JWT_REFRESH_SECRET -> openssl rand -base64 48 (diferente do acima)
      - key: DATABASE_URL
        sync: false
      # Opcional: conexão DIRETA (não agrupada), usada só pelas migrations.
      # No Neon, é a connection string sem "-pooler" no host.
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
    # PORT é injetado automaticamente pelo Render — não declare aqui.
